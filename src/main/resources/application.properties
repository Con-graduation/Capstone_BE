# 루트(back/)의 .env 로드 — 없으면 OS/CI 환경 변수만 사용
dotenv.enabled=true
dotenv.filename=.env
dotenv.ignore-if-missing=true

## Mail (Brevo SMTP)
# Brevo SMTP 호스트/포트 (TLS: 587)
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USER}
spring.mail.password=${BREVO_SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 발신자 주소
mail.from=${MAIL_FROM}
spring.application.name=daily-guitar

# Database Configuration (PostgreSQL required)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA Configuration
spring.jpa.database-platform=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console disabled
spring.h2.console.enabled=false

# JWT Configuration (.env: JWT_SECRET, 선택 JWT_EXPIRATION)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:8640000000}

# Server Configuration
server.port=8080

# Logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.servlet.DispatcherServlet=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.apache.coyote.http11.Http11Processor=WARN

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# AI Analysis Configuration
ai.python.executable=${AI_PYTHON_EXEC:/home/ec2-user/py39/bin/python}
ai.python.script.path=${AI_PYTHON_SCRIPT_PATH:/home/ec2-user/capstone-analysis/src/analysis/unified_eval.py}
ai.viz.dir=${AI_VIZ_DIR:/home/ec2-user/capstone-analysis/out/viz}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Google OAuth2 Configuration (.env: GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET, GOOGLE_OAUTH_REDIRECT_URI)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/calendar
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v2/userinfo

# MCP Server Configuration
mcp.server.url=${MCP_SERVER_URL:http://localhost:8081}

# AI Configuration (OpenAI) — .env: OPENAI_API_KEY, AI_OPENAI_MODEL
ai.openai.api.key=${OPENAI_API_KEY}
ai.openai.model=${AI_OPENAI_MODEL:gpt-4o-mini}

# YouTube Data API — .env: YOUTUBE_API_KEY
youtube.api.key=${YOUTUBE_API_KEY}