# 상위 폴더(back/)의 .env (mcp-server에서 bootRun 시 .. 기준)
dotenv.enabled=true
dotenv.directory=..
dotenv.filename=.env
dotenv.ignore-if-missing=true

## Database Configuration (PostgreSQL — 백엔드와 동일 DB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MCP Server Configuration
mcp.server.port=8081
mcp.server.name=daily-guitar-mcp-server

# HTTP Server Configuration (localhost만 바인딩)
server.port=${MCP_SERVER_PORT:8081}
server.address=127.0.0.1

# Google OAuth — 백엔드와 동일 클라이언트 (.env 변수명 통일)
google.client.id=${GOOGLE_OAUTH_CLIENT_ID}
google.client.secret=${GOOGLE_OAUTH_CLIENT_SECRET}

# JWT (.env: JWT_SECRET — 백엔드와 동일)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:8640000000}

# Jackson Configuration (Java 8 time support)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Logging
logging.level.root=INFO
logging.level.dailyGuitar.capstone.mcp=DEBUG
