# 상위 폴더(back/)의 .env (mcp-server에서 bootRun 시 .. 기준)
dotenv.enabled=true
dotenv.directory=..
dotenv.filename=.env
dotenv.ignore-if-missing=true

## Database Configuration (PostgreSQL - 백엔드와 동일한 DB 사용)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# MCP Server Configuration
mcp.server.port=8081
mcp.server.name=daily-guitar-mcp-server

# Google OAuth Configuration (구글 캘린더 API 호출용) — .env: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# Logging
logging.level.root=INFO
logging.level.dailyGuitar.capstone.mcp=DEBUG
